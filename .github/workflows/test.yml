name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate the manifest and translations
        run: |
          node -e 'for (const f of ["manifest.json", "i18n/en.json"]) JSON.parse(require("fs").readFileSync(f, "utf8"))'
      - name: shellcheck
        run: shellcheck -x -s bash bin/system-monitor lib/*.sh
      - name: Tests
        run: node --test tests/
